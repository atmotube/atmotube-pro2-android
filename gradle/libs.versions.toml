[versions]
kotlin = "2.2.20"
kotlinKsp = "2.2.20-2.0.2"
agp = "8.13.1"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.10.00"
hilt = "2.57.2"
googleServices = "4.4.4"
firebaseCrashlytics = "3.0.6"
triplet = "3.12.1"
material3Android = "1.4.0"

mcumgr = "2.7.3"
scanner = "1.6.0"
ble = "2.11.0"

[libraries]
nordic-mcumgr = { group = "no.nordicsemi.android", name = "mcumgr-ble", version.ref = "mcumgr" }
nordic-scanner = { group = "no.nordicsemi.android.support.v18", name = "scanner", version.ref = "scanner" }
nordic-blektx = { group = "no.nordicsemi.android", name = "ble-ktx", version.ref = "ble" }
nordic-blelivedata = { group = "no.nordicsemi.android", name = "ble-livedata", version.ref = "ble" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "kotlinKsp" }
dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
triplet-play = { id = "com.github.triplet.play", version.ref = "triplet" }

google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
